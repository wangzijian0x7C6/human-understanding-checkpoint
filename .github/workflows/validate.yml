name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill and repository
        run: python3 scripts/validate_skill.py

      - name: Validate benchmark suite
        run: python3 benchmark/benchmark.py validate

      - name: Run harness tests
        run: python3 -m unittest discover -s benchmark/tests -p 'test_*.py'
